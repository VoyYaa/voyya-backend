name: Actualizar lockfile

# Manual. Existe porque el entorno de desarrollo no alcanza
# registry.npmjs.org, así que un `package.json` puede quedar declarando
# dependencias que el lockfile no conoce. Cuando eso pasa, el Dockerfile
# (`pnpm install --frozen-lockfile`) falla en el despliegue y CI no carga las
# suites afectadas. Este workflow regenera el lockfile donde sí hay red.
on:
  workflow_dispatch:

concurrency:
  group: update-lockfile-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.24.0'

jobs:
  update-lockfile:
    name: Regenerar pnpm-lock.yaml y commitearlo
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Estado antes
        run: |
          echo "--- pnpm ---"; pnpm --version
          echo "--- workspace ---"; cat pnpm-workspace.yaml 2>/dev/null || echo "(sin pnpm-workspace.yaml)"
          echo "--- dependencias declaradas en apps/api ---"
          node -p "JSON.stringify({...require('./apps/api/package.json').dependencies, ...require('./apps/api/package.json').devDependencies}, null, 2)"
          echo "--- sha del lockfile ---"; git hash-object pnpm-lock.yaml

      # Resuelve el árbol y reescribe el lockfile. `--lockfile-only` evita bajar
      # e instalar los paquetes: sólo interesa el lockfile, y así el paso es más
      # rápido y con menos superficie de fallo.
      - name: Regenerar el lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Estado después
        run: |
          echo "--- sha del lockfile ---"; git hash-object pnpm-lock.yaml
          echo "--- ¿cambió? ---"
          git --no-pager diff --stat -- pnpm-lock.yaml || true
          echo "--- ¿aparecen las dependencias que faltaban? ---"
          for p in "@types/multer" "@sentry/node" "expo-server-sdk" "pino"; do
            printf "%-20s " "$p"
            grep -q "$p" pnpm-lock.yaml && echo "sí" || echo "NO"
          done

      # El commit va ANTES de verificar: si el lockfile mejoró pero algo más
      # falla, el avance no se pierde y queda diagnosticable en el repo.
      - name: Commitear si cambió
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "::warning::El lockfile no cambió. Revisa el paso 'Estado después'."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: regenerar pnpm-lock.yaml

          Generado por el workflow Actualizar lockfile, que corre donde sí hay
          acceso a npm."
          git push

      # Última comprobación, ya sin poder perder el trabajo: es el mismo comando
      # que corre el Dockerfile, así que si falla aquí también fallaría en Railway.
      - name: Comprobar que satisface --frozen-lockfile
        run: pnpm install --frozen-lockfile
